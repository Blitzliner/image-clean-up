[project]
name = "fotosort"
version = "0.1.0"
description = "Fotos chronologisch sortieren, Duplikate aussortieren, Favoriten markieren und Jahresrückblick-PDF erstellen"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastembed>=0.5",
    "fpdf2>=2.7",
    "imagehash>=4.3",
    "numpy>=2.0",
    "opencv-python-headless>=4.8",
    "piexif>=1.1.3",
    "pillow>=10.0",
    "pillow-heif>=0.16",
    "python-pptx>=1.0",
    "pyyaml>=6.0",
    "reverse-geocoder>=1.5.1",
    "tzdata>=2024.1",
]

[project.scripts]
fotosort = "fotosort:main"

[build-system]
requires = ["uv_build>=0.8.0,<0.12.0"]
build-backend = "uv_build"
